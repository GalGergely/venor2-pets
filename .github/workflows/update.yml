name: Update pets

on:
  schedule:
    - cron: '7 * * * *'   # óránként, az óra 7. percében
  workflow_dispatch:       # kézi indítás a GitHub Actions fülről

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch pets from wiki
        run: node scripts/update.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain pets.json)" ]; then
            git config user.name  "pet-bot"
            git config user.email "pet-bot@users.noreply.github.com"
            git add pets.json
            git commit -m "Update pets"
            git push
          fi
