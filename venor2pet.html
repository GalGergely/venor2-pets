<script>(function(){try{var t=localStorage.getItem("venor2_theme_v1");if(!t){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";}document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme="dark";}})();</script>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#05070f;--bg2:#0b1026;--glass:rgba(255,255,255,.055);--glass-brd:rgba(255,255,255,.09);--txt:#eef2ff;--txt-dim:#9aa3c7;--accent1:#ff9a3d;--accent2:#ff5e3a;--green:#3ddc97;--red:#ff4d6d;--gold:#ffd166}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Outfit',system-ui,sans-serif;color:var(--txt);background:radial-gradient(1200px 800px at 85% -10%,#1a1340 0%,transparent 55%),radial-gradient(900px 700px at -10% 20%,#141a3a 0%,transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-2;background:inherit}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 26s ease-in-out infinite alternate}
.blob.b1{width:44vw;height:44vw;background:#ff6a3d;top:-12vw;right:-8vw}
.blob.b2{width:36vw;height:36vw;background:#4d3dff;bottom:-10vw;left:-6vw;animation-delay:-8s}
.blob.b3{width:26vw;height:26vw;background:#1fb5c4;top:38%;left:55%;animation-delay:-16s;opacity:.35}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(6vw,5vh) scale(1.18)}}
.wrap{max-width:1280px;margin:0 auto;padding:0 22px}
.hero{padding:52px 0 26px;text-align:center}
.hero h1{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:clamp(40px,7vw,64px);line-height:1;margin:16px 0 8px;letter-spacing:1px}
.hero h1 .grad{background:linear-gradient(120deg,var(--accent1),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--txt-dim);font-size:15px;max-width:640px;margin:0 auto 26px}
.hero p b{color:var(--txt)}
.nav-links{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.nav-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:'Outfit',sans-serif;font-weight:600;font-size:14px;color:var(--txt);text-decoration:none;padding:11px 18px;border-radius:999px;border:1px solid var(--glass-brd);background:var(--glass);backdrop-filter:blur(10px);transition:.2s;white-space:nowrap}
.nav-btn.social{min-width:0;width:44px;height:44px;padding:0;border-radius:50%}
.nav-btn.social svg{width:20px;height:20px}
.nav-btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.3);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.nav-btn.twitch{color:#c4b0ff;border-color:rgba(169,112,255,.35);background:rgba(169,112,255,.08)}
.nav-btn.twitch:hover{border-color:rgba(169,112,255,.6)}
.nav-btn.discord{color:#a3b1ff;border-color:rgba(88,101,242,.4);background:rgba(88,101,242,.1)}
.nav-btn.discord:hover{border-color:rgba(88,101,242,.7)}
.ring-box{display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;margin-top:6px}
.ring{position:relative;width:132px;height:132px}
.ring svg{transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:rgba(255,255,255,.09);stroke-width:9}
.ring .fg{fill:none;stroke:url(#ringGrad);stroke-width:9;stroke-linecap:round;transition:stroke-dasharray .9s cubic-bezier(.65,0,.35,1)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .center .num{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:30px}
.ring .center .lbl{font-size:11px;color:var(--txt-dim);letter-spacing:1.5px;text-transform:uppercase}
.legend{display:grid;gap:10px;text-align:left}
.legend .row{display:flex;align-items:center;gap:11px;font-size:15px;color:var(--txt-dim)}
.legend .row .d{width:16px;height:16px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.legend .row.own .d{background:rgba(61,220,151,.18);color:var(--green);border:1px solid rgba(61,220,151,.45)}
.legend .row.miss .d{background:rgba(255,77,109,.16);color:var(--red);border:1px solid rgba(255,77,109,.4)}
.legend .row .d.flip{transform:scale(-1)}
.legend .row b{color:var(--txt);font-variant-numeric:tabular-nums;min-width:34px}
.legend .row span:last-child{color:var(--txt-dim)}
.controls{position:sticky;top:12px;z-index:40;margin:26px auto 8px;display:flex;justify-content:center}
.controls-inner{width:100%;max-width:820px;display:flex;flex-direction:column;gap:12px;background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--glass-brd);border-radius:20px;padding:14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.ctrl-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.search{flex:1 1 260px;max-width:480px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.25);border:1px solid var(--glass-brd);border-radius:13px;padding:10px 14px}
.search svg{flex:none;opacity:.55}
.search input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-family:inherit;font-size:15px;min-width:0}
.search input::placeholder{color:var(--txt-dim)}
.pill{border:1px solid var(--glass-brd);background:rgba(0,0,0,.25);color:var(--txt-dim);font-family:inherit;font-weight:600;font-size:14px;padding:9px 16px;border-radius:999px;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.pill:hover{border-color:rgba(255,255,255,.28);color:var(--txt);transform:translateY(-1px)}
.pill .cnt{font-size:12px;opacity:.7}
.pill.active{background:linear-gradient(120deg,var(--accent1),var(--accent2));border-color:transparent;color:#1a0b02;box-shadow:0 6px 18px rgba(255,120,50,.35)}
.pill.active.own.active-own{background:linear-gradient(120deg,#3ddc97,#21b06b);color:#04240f;box-shadow:0 6px 18px rgba(61,220,151,.3)}
.pill.active.miss.active-miss{background:linear-gradient(120deg,#ff6a7d,#e04b68);color:#2b050b;box-shadow:0 6px 18px rgba(255,77,109,.3)}
.pill.icon-only{width:42px;padding:9px;justify-content:center}
select{background:rgba(0,0,0,.25);border:1px solid var(--glass-brd);color:var(--txt);font-family:inherit;font-weight:600;font-size:14px;padding:9px 14px;border-radius:12px;outline:none;cursor:pointer}
.pill-select{padding:9px 14px;cursor:pointer;max-width:260px;text-overflow:ellipsis}
select option{background:#10142b;color:var(--txt)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{font-size:13px;font-weight:600;padding:7px 13px;border-radius:999px;cursor:pointer;border:1px solid var(--glass-brd);background:rgba(255,255,255,.04);color:var(--txt-dim);transition:.18s;display:inline-flex;align-items:center;gap:7px}
.chip:hover{color:var(--txt)}
.chip.active{color:#070a18;border-color:transparent;box-shadow:0 4px 14px rgba(255,255,255,.16)}
.chip .cnt{opacity:.75;font-size:12px}
.album{padding-bottom:60px}
.section{margin-top:34px}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;cursor:pointer;user-select:none;border-radius:12px;margin-left:-8px;padding:4px 8px;transition:background .2s}
.section-head:hover{background:rgba(255,255,255,.04)}
.section-head:active{background:rgba(255,255,255,.07)}
.section-head .dot{width:13px;height:13px;border-radius:4px;box-shadow:0 0 14px currentColor;flex-shrink:0}
.section-head h2{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:24px;letter-spacing:.5px;white-space:nowrap}
.section-head h2 .cico{font-size:20px;margin-right:7px}
.section-head .prog{font-size:13px;color:var(--txt-dim);font-variant-numeric:tabular-nums;padding:4px 11px;border:1px solid var(--glass-brd);border-radius:999px;background:var(--glass);flex-shrink:0}
.section-head .bar{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;min-width:24px}
.section-head .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c),var(--c2));transition:width .8s cubic-bezier(.65,0,.35,1)}
.section-head .chev{margin-left:2px;font-size:11px;line-height:1;color:var(--txt-dim);flex-shrink:0;transition:transform .25s cubic-bezier(.4,0,.2,1)}
.section.collapsed .chev{transform:rotate(-90deg)}
.section.collapsed .grid{display:none}
.section.collapsed .section-head{margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
@media(min-width:720px){.grid{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}}
.card{position:relative;text-align:center;cursor:pointer;background:var(--glass);border:1px solid var(--glass-brd);border-radius:18px;padding:14px 10px 12px;transition:transform .22s cubic-bezier(.2,.7,.3,1.2),border-color .22s,box-shadow .22s;font-family:inherit;color:inherit;animation:cardIn .45s cubic-bezier(.2,.7,.3,1) backwards}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-5px);border-color:rgba(255,255,255,.24);box-shadow:0 14px 34px rgba(0,0,0,.42)}
.card:active{transform:scale(.97)}
.card .icon-holder{width:88px;height:88px;margin:0 auto;display:flex;align-items:center;justify-content:center;border-radius:16px;position:relative;background:rgba(0,0,0,.28);border:1px dashed rgba(255,255,255,.14);transition:.22s}
.card img{width:76px;height:76px;image-rendering:pixelated;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));transition:transform .25s}
.card:hover img{transform:scale(1.12) rotate(-2deg)}
.card .check{position:absolute;top:-9px;right:-9px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;background:linear-gradient(135deg,#3ddc97,#18b46b);color:#04240f;border:3px solid #0b1026;opacity:0;transform:scale(.3);transition:.28s cubic-bezier(.34,1.56,.64,1);box-shadow:0 6px 16px rgba(61,220,151,.45)}
.card.owned{border-color:rgba(61,220,151,.5);background:linear-gradient(160deg,rgba(61,220,151,.10),rgba(61,220,151,.02) 60%)}
.card.owned .check{opacity:1;transform:scale(1)}
.card.owned .icon-holder{border-style:solid;border-color:rgba(61,220,151,.45)}
.card.owned img{filter:drop-shadow(0 6px 14px rgba(61,220,151,.35))}
.card .name{margin-top:10px;font-weight:700;font-size:15px;line-height:1.2}
.card .eng{font-size:11.5px;color:var(--txt-dim);margin-top:3px;opacity:.75}
.card .bonus{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px}
.card .bchip{font-size:10.5px;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.05);color:var(--txt-dim)}
.card.owned .bchip{color:#7ef0c5;background:rgba(61,220,151,.09)}
.card .tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px}
.card .tag{font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.06)}
.empty{text-align:center;color:var(--txt-dim);padding:56px 0;font-size:15px;border:1px dashed var(--glass-brd);border-radius:20px;background:rgba(0,0,0,.18)}
.empty b{color:var(--txt)}
.hint{margin-top:22px;text-align:center;color:var(--txt-dim);font-size:13px;opacity:.8}
.bonus-tab{position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:45;display:flex;align-items:stretch;pointer-events:none}
.bt-panel{width:248px;align-self:center;max-height:calc(100vh - 24px);display:flex;flex-direction:column;background:rgba(10,14,30,.95);border:1px solid var(--glass-brd);border-right:none;border-radius:18px 0 0 18px;backdrop-filter:blur(14px);overflow:hidden;pointer-events:none;transform:translateX(120%);transition:transform .38s cubic-bezier(.2,.7,.3,1)}
.bonus-tab.open .bt-panel{transform:none;pointer-events:auto;box-shadow:0 18px 44px rgba(0,0,0,.5)}
.bt-toggle{pointer-events:auto;width:46px;height:190px;flex:none;align-self:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:'Outfit',sans-serif;color:var(--gold);line-height:1;background:var(--glass);border:1px solid rgba(255,209,102,.4);border-radius:23px;backdrop-filter:blur(10px);transition:border-radius .34s ease,border .34s ease,height .34s ease,align-self .34s ease,box-shadow .2s}
.bt-toggle:hover{box-shadow:0 8px 26px rgba(0,0,0,.4);border-color:rgba(255,209,102,.7)}
.bonus-tab.open .bt-toggle{height:190px;align-self:center;border-radius:0 16px 16px 0;border-left:none}
.bt-toggle .bt-label{writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:6px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:17px;color:var(--gold)}
.bt-toggle .bt-arrow{width:20px;height:20px;color:var(--txt);transition:transform .3s}
.bonus-tab.open .bt-toggle .bt-arrow{transform:rotate(180deg)}
.bt-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--glass-brd);font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;letter-spacing:.5px}
.bt-head .bt-x{cursor:pointer;border:0;background:none;color:var(--txt-dim);font-size:15px;padding:2px 4px;line-height:1}
.bt-head .bt-x:hover{color:var(--txt)}
.bt-list{overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:5px}
.bt-row{display:flex;flex-direction:column;gap:3px}
.bt-row .bt-line{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.bt-row .bt-name{color:var(--txt);font-weight:500}
.bt-row .bt-vals{color:var(--txt-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.bt-row .bt-vals b{color:var(--gold);font-weight:700}
.bt-bar{height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bt-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--accent2));transition:width .5s cubic-bezier(.65,0,.35,1)}
.bt-empty{padding:10px 2px;font-size:13px;color:var(--txt-dim)}
@media(max-width:720px){.bonus-tab{right:6px}.bt-panel{width:226px}.bt-toggle{width:38px;height:160px;border-radius:19px}.bt-toggle .bt-label{font-size:14px;letter-spacing:4px}.bonus-tab.open .bt-toggle{border-radius:0 14px 14px 0}}
:root[data-theme="light"]{--bg1:#f6f7fd;--bg2:#e7ebfb;--glass:rgba(255,255,255,.72);--glass-brd:rgba(22,32,88,.13);--txt:#151b36;--txt-dim:#5b6489;--accent1:#e5761b;--accent2:#d84a26;--green:#0fa862;--red:#e0304d;--gold:#b07d0e}
:root[data-theme="light"] body{background:radial-gradient(1200px 800px at 85% -10%,#e9defc 0%,transparent 55%),radial-gradient(900px 700px at -10% 20%,#dbe4ff 0%,transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2))}
:root[data-theme="light"] .blob{opacity:.32}
:root[data-theme="light"] .search,:root[data-theme="light"] select,:root[data-theme="light"] .pill{background:rgba(20,30,88,.06)}
:root[data-theme="light"] select option{background:#fff;color:var(--txt)}
:root[data-theme="light"] .controls-inner{background:rgba(255,255,255,.82)}

:root[data-theme="light"] .empty{background:rgba(20,30,88,.05)}
:root[data-theme="light"] .bt-panel{background:rgba(255,255,255,.97)}
:root[data-theme="light"] .bt-toggle{background:rgba(255,255,255,.85)}
.streak{display:inline-flex;align-items:center;gap:7px;margin-top:18px;padding:8px 16px;border-radius:999px;font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:1px;font-size:15px;color:var(--gold);background:rgba(255,209,102,.09);border:1px solid rgba(255,209,102,.25)}
.share-banner{margin-top:20px}
.share-inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;background:var(--glass);border:1px solid var(--glass-brd);border-radius:16px;padding:12px 16px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.share-inner .sb-txt{font-size:14px;color:var(--txt)}
.pill.sb{padding:7px 14px;font-size:13px;background:rgba(0,0,0,.25)}
.pill.sb.hl{background:linear-gradient(120deg,var(--accent1),var(--accent2));border-color:transparent;color:#1a0b02;font-weight:700}
.pill.sb.hl:hover{box-shadow:0 6px 18px rgba(255,120,50,.3)}
.pill.sb.sb-x{opacity:.85}
.view-bar{margin-top:20px;display:none;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(255,209,102,.09);border:1px solid rgba(255,209,102,.3);border-radius:16px;padding:12px 16px;color:var(--gold);font-size:14px;font-weight:600}
.view-bar .spacer{flex:1}
.view-bar .pill.sb{color:var(--txt);background:rgba(0,0,0,.25)}
:root[data-theme="light"] .view-bar .pill.sb{background:rgba(20,30,88,.06)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);z-index:60;opacity:0;pointer-events:none;background:rgba(10,14,30,.92);color:var(--txt);border:1px solid var(--glass-brd);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:opacity .28s,transform .28s;box-shadow:0 12px 34px rgba(0,0,0,.45)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
:root[data-theme="light"] .toast{background:rgba(255,255,255,.96)}
.card{contain-intrinsic-size:auto 212px;content-visibility:auto}
.icon-holder .sk{position:absolute;inset:0;border-radius:16px;pointer-events:none;background:linear-gradient(110deg,rgba(255,255,255,.05) 36%,rgba(255,255,255,.13) 50%,rgba(255,255,255,.05) 64%);background-size:220% 100%;animation:shim 1.3s linear infinite;transition:opacity .3s}
@keyframes shim{0%{background-position:120% 0}100%{background-position:-120% 0}}
.icon-holder img{position:relative;z-index:1}
.icon-holder.loaded .sk{opacity:0}
footer{margin-top:20px;padding:22px 0 40px;border-top:1px solid rgba(255,255,255,.06);text-align:center;color:var(--txt-dim);font-size:13px}
footer a{color:var(--accent1);text-decoration:none}
::selection{background:rgba(255,154,61,.35)}

var ICON_BASE = "https://wiki.venor2.hu/assets/icons/";
var STORE_KEY = "venor2_pet_album_v1";
var THEME_KEY = "venor2_theme_v1";
var STREAK_KEY = "venor2_streak_v1";
var FLAT_KEY = "venor2_flat_v1";
var CAT_KEY = "venor2_catopen_v1";

var CAT_COLORS = {
  "Itemshop":           { c:"#ffd166", c2:"#f5b321", ico:"🛒" },
  "Vegyeskereskedő":    { c:"#4ade80", c2:"#22c55e", ico:"💰" },

  "Egyéb":              { c:"#94a3b8", c2:"#64748b", ico:"📦" }
};
try { var owned = JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); }
catch(e){ var owned = []; }
if(!Array.isArray(owned)) owned = [];
var ownedSet = new Set(owned);
var viewSet = null;
function hasOwn(vnum){ return viewSet ? viewSet.has(vnum) : ownedSet.has(vnum); }
function ownCount(){ return viewSet ? viewSet.size : ownedSet.size; }

var state = { status:"all", cat:"all", bonus:"all", q:"", flat:false };

var catManual = {};
try{ var _cm = JSON.parse(localStorage.getItem(CAT_KEY) || "{}"); if(_cm && typeof _cm === "object" && !Array.isArray(_cm)) catManual = _cm; }catch(e){}
function saveCatManual(){ try{ localStorage.setItem(CAT_KEY, JSON.stringify(catManual)); }catch(e){} }

function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(Array.from(ownedSet))); }catch(e){} noteToday();  }
function esc(s){ return String(s).replace(/[&<>"']/g, function(m){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]; }); }

function inCats(p, cat){ return p.cats && p.cats.indexOf(cat) !== -1; }

function isFiltered(){
  return !!state.q || state.status !== "all" || state.bonus !== "all" || state.cat !== "all";
}
function catCollapsed(cat, complete){
  var m = catManual[cat];
  if(m === "open") return false;
  if(m === "close") return true;
  if(isFiltered()) return false;
  return !!complete;
}

function presentCats(){
  var found = [];
  Object.keys(CAT_COLORS).forEach(function(k){ if(PETS.some(function(p){return inCats(p,k);})) found.push(k); });
  PETS.forEach(function(p){ p.cats.forEach(function(c){ if(found.indexOf(c)===-1 && CAT_COLORS[c]) found.push(c); }); });
  return found;
}

function updateSectionProgress(card){
  var sect = card.closest(".section"); if(!sect) return;
  var cat = sect.getAttribute("data-cat");
  if(!cat) return;
  var catOwn = PETS.filter(function(p){return inCats(p,cat);});
  var ownHere = catOwn.filter(function(p){return hasOwn(p.vnum);}).length;
  sect.querySelector(".prog").textContent = ownHere + " / " + catOwn.length;
  sect.querySelector(".bar i").style.width = (ownHere/catOwn.length*100) + "%";
  var complete = ownHere === catOwn.length && catOwn.length > 0;
  sect.setAttribute("data-complete", complete ? "1" : "0");
  sect.classList.toggle("collapsed", catCollapsed(cat, complete));
  var hd = sect.querySelector(".section-head");
  if(hd) hd.setAttribute("aria-expanded", sect.classList.contains("collapsed") ? "false" : "true");
}

function updateStats(){
  var own = ownCount(), all = PETS.length, miss = all - own;
  var r = Math.PI * 2 * 56;
  var off = r * (1 - own / all);
  document.getElementById("ringFg").style.strokeDashoffset = off;
  document.getElementById("ringNum").textContent = own + "/" + all;
  document.getElementById("statOwn").textContent = own;
  document.getElementById("statMiss").textContent = miss;
  document.querySelectorAll("[data-cnt]").forEach(function(btn){
    var k = btn.getAttribute("data-cnt");
    if(k==="all"){ btn.textContent = all; }
    else if(k==="own"){ btn.textContent = own; }
    else if(k==="miss"){ btn.textContent = miss; }
  });
  updateBonusTab();
}

function updateBonusTab(){
  var list = document.getElementById("btList");
  if(!list) return;
  var agg = {};
  PETS.forEach(function(p){
    var own = hasOwn(p.vnum);
    (p.bonus||[]).forEach(function(b){
      if(!agg[b.t]) agg[b.t] = { all:0, own:0 };
      agg[b.t].all += b.v;
      if(own) agg[b.t].own += b.v;
    });
  });
  var keys = Object.keys(agg).sort(function(a,b){
    return agg[b].all - agg[a].all;
  });
  if(!keys.length){
    list.innerHTML = "<div class=\"bt-empty\">Nincs bónusz adat.</div>";
    return;
  }
  list.innerHTML = keys.map(function(k){
    var a = agg[k];
    var pct = a.all > 0 ? (a.own / a.all * 100) : 0;
    return "<div class=\"bt-row\"><div class=\"bt-line\"><span class=\"bt-name\">" + esc(k) + "</span>" +
           "<span class=\"bt-vals\"><b>" + a.own + "</b>/" + a.all + "</span></div>" +
           "<div class=\"bt-bar\"><i style=\"width:" + pct.toFixed(1) + "%\"></i></div></div>";
  }).join("");
}

function loadCatChips(){
  var box = document.getElementById("catChips");
  box.innerHTML = "";
  var chipAll = document.createElement("button");
  chipAll.className = "chip active"; chipAll.dataset.cat = "all";
  chipAll.innerHTML = "<span class=\"cnt\">" + PETS.length + "</span> Összes";
  chipAll.addEventListener("click", function(){ setCat("all"); });
  box.appendChild(chipAll);
  presentCats().forEach(function(cat){
      var n = PETS.filter(function(p){return inCats(p,cat);}).length;
      var ch = document.createElement("button");
      ch.className = "chip"; ch.dataset.cat = cat;
      ch.style.color = CAT_COLORS[cat].c;
      ch.innerHTML = "<span class=\"cnt\">" + n + "</span> " + CAT_COLORS[cat].ico + " " + esc(cat);
      ch.addEventListener("click", (function(c){return function(){ setCat(c); };})(cat));
      box.appendChild(ch);
    });
}

function setCat(cat){
  state.cat = cat;
  document.querySelectorAll("#catChips .chip").forEach(function(ch){ ch.classList.toggle("active", ch.dataset.cat === cat); });
  render(false);
}

function legacyBonus(){
  var labels = [];
  PETS.forEach(function(p){ p.bonus.forEach(function(b){ if(labels.indexOf(b.t) === -1) labels.push(b.t); }); });
  return labels;
}

function buildBonusMenu(){
  var sel = document.getElementById("selBonus");
  var items = legacyBonus().sort(function(a,b){ return a.localeCompare(b,"hu"); });
  sel.innerHTML = "";
  var o = document.createElement("option"); o.value="all"; o.textContent="🎁 Minden bónusz"; sel.appendChild(o);
  items.forEach(function(t){
    var op = document.createElement("option"); op.value = t; op.textContent = t; sel.appendChild(op);
  });
}

function matches(p){
  if(state.q){
    var hay = (p.name + " " + p.id + " " + (p.cats||[]).join(" ") + " " + p.bonus.map(function(b){return b.t;}).join(" ")).toLowerCase();
    if(hay.indexOf(state.q) === -1) return false;
  }
  if(state.status === "own" && !hasOwn(p.vnum)) return false;
  if(state.status === "miss" && hasOwn(p.vnum)) return false;
  if(state.cat !== "all" && !inCats(p, state.cat)) return false;
  if(state.bonus !== "all" && !p.bonus.some(function(b){return b.t === state.bonus;})) return false;
  return true;
}

function bonusHtml(p){
  return p.bonus.slice(0,3).map(function(b){
    return "<span class=\"bchip\">+" + b.v + " " + esc(b.t) + "</span>";
  }).join("") + (p.bonus.length > 3 ? "<span class=\"bchip\">+" + (p.bonus.length-3) + " további</span>" : "");
}

function cardHtml(p, delay){
  var isOwn = hasOwn(p.vnum);
  var src = p.icon.indexOf("data:") === 0 ? p.icon : ICON_BASE + esc(p.icon);
  var html = "<button class=\"card" + (isOwn ? " owned" : "") + "\" data-vnum=\"" + p.vnum + "\" style=\"animation-delay:" + (Math.min(delay,16)*0.03) + "s\">";
  html += "<div class=\"icon-holder\"><span class=\"sk\"></span><img loading=\"lazy\" src=\"" + src + "\" alt=\"" + esc(p.name) + "\" onload=\"this.closest('.icon-holder').classList.add('loaded')\" onerror=\"imgErr(this)\"><span class=\"check\">✓</span></div>";
  html += "<div class=\"name\">" + esc(p.name) + "</div>";
  html += "<div class=\"eng\">" + esc(p.id) + "</div>";
  html += "<div class=\"tags\">" + p.cats.map(function(c){ var cc=CAT_COLORS[c]; return "<span class=\"tag\" style=\"color:" + cc.c + ";background:rgba(255,255,255,.05)\">" + cc.ico + " " + esc(c) + "</span>"; }).join("") + "</div>";
  html += "<div class=\"bonus\">" + bonusHtml(p) + "</div>";
  html += "</button>";
  return html;
}

function renderFlat(){
  var album = document.getElementById("album");
  var list = PETS.filter(function(p){ return matches(p); });
  if(!list.length){
    album.innerHTML = "<div class=\"empty\"><b>Nincs találat.</b><br>Próbálj más keresési vagy szűrési feltételt.</div>";
    updateStats();
    return;
  }
  var ownHere = list.filter(function(p){return hasOwn(p.vnum);}).length;
  var html = "<section class=\"section\" style=\"--c:" + CAT_COLORS.Itemshop.c + ";--c2:" + CAT_COLORS.Itemshop.c2 + "\">";
  html += "<div class=\"section-head\">";
  html += "<span class=\"dot\" style=\"color:" + CAT_COLORS.Itemshop.c + ";background:" + CAT_COLORS.Itemshop.c + "\"></span>";
  html += "<h2 style=\"color:" + CAT_COLORS.Itemshop.c + "\"><span class=\"cico\">🗂️</span>Minden kisállat</h2>";
  html += "<span class=\"prog\">" + ownHere + " / " + list.length + "</span>";
  html += "<div class=\"bar\"><i style=\"width:" + (ownHere/list.length*100) + "%\"></i></div>";
  html += "</div><div class=\"grid\">";
  html += list.map(function(p, i){ return cardHtml(p, i); }).join("");
  html += "</div></section>";
  album.innerHTML = html;
  updateStats();
}

function render(animate){
  var album = document.getElementById("album");
  if(state.flat){ renderFlat(); return; }
  var cats = presentCats();

  var html = "";
  var any = false;
  cats.forEach(function(cat){
    var list = PETS.filter(function(p){ return inCats(p,cat) && matches(p); });
    if(!list.length) return;
    any = true;
    var catOwn = PETS.filter(function(p){return inCats(p,cat);});
    var ownHere = catOwn.filter(function(p){return hasOwn(p.vnum);}).length;
    var complete = ownHere === catOwn.length && catOwn.length > 0;
    var collapsed = catCollapsed(cat, complete);
    var colC = collapsed ? " collapsed" : "";
    var colA = collapsed ? "false" : "true";
    var col = CAT_COLORS[cat];
    html += "<section class=\"section" + colC + "\" data-cat=\"" + esc(cat) + "\" data-complete=\"" + (complete?"1":"0") + "\" style=\"--c:" + col.c + ";--c2:" + col.c2 + "\">";
    html += "<div class=\"section-head\" role=\"button\" tabindex=\"0\" aria-expanded=\"" + colA + "\" title=\"Összecsukás / kinyitás\">";
    html += "<span class=\"dot\" style=\"color:" + col.c + ";background:" + col.c + "\"></span>";
    html += "<h2 style=\"color:" + col.c + "\"><span class=\"cico\">" + col.ico + "</span>" + esc(cat) + "</h2>";
    html += "<span class=\"prog\">" + ownHere + " / " + catOwn.length + "</span>";
    html += "<div class=\"bar\"><i style=\"width:" + (ownHere/catOwn.length*100) + "%\"></i></div>";
    html += "<span class=\"chev\">▼</span></div><div class=\"grid\">";
    var delay = 0;
    list.forEach(function(p){
      html += cardHtml(p, delay);
      delay++;
    });
    html += "</div></section>";
  });

  if(!any){
    album.innerHTML = "<div class=\"empty\"><b>Nincs találat.</b><br>Próbálj más keresési vagy szűrési feltételt.</div>";
  } else {
    album.innerHTML = html;
  }
  updateStats();
}

var PLACEHOLDER = "data:image/svg+xml," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><rect width='64' height='64' rx='12' fill='rgba(255,255,255,0.06)'/><text x='32' y='38' font-size='20' text-anchor='middle' dominant-baseline='middle'>🐾</text></svg>");
function imgErr(img){ img.onerror = null; img.src = PLACEHOLDER; }

document.getElementById("album").addEventListener("click", function(e){
  var card = e.target.closest(".card");
  if(!card) return;
  if(viewSet) return;
  var vnum = Number(card.dataset.vnum);
  if(ownedSet.has(vnum)){
    ownedSet.delete(vnum);
    card.classList.remove("owned");
  } else {
    ownedSet.add(vnum);
    card.classList.add("owned");
  }
  updateStats();
  updateSectionProgress(card);
  if(state.status === "own" || state.status === "miss") render(false);
  save();
});

document.getElementById("album").addEventListener("click", function(e){
  var head = e.target.closest(".section-head");
  if(!head) return;
  var sect = head.closest(".section");
  var cat = sect ? sect.getAttribute("data-cat") : null;
  if(!cat) return;
  if(sect.classList.contains("collapsed")){
    sect.classList.remove("collapsed");
    if(sect.getAttribute("data-complete") === "1") catManual[cat] = "open";
    else delete catManual[cat];
    head.setAttribute("aria-expanded", "true");
  } else {
    sect.classList.add("collapsed");
    catManual[cat] = "close";
    head.setAttribute("aria-expanded", "false");
  }
  saveCatManual();
});
document.getElementById("album").addEventListener("keydown", function(e){
  if(e.key !== "Enter" && e.key !== " ") return;
  var head = e.target && e.target.closest ? e.target.closest(".section-head") : null;
  if(!head) return;
  e.preventDefault();
  head.click();
});

document.getElementById("search").addEventListener("input", function(){
  state.q = this.value.trim().toLowerCase();
  render(false);
});

function setStatus(s){
  state.status = s;
  document.querySelectorAll("[data-status]").forEach(function(b){
    var act = b.dataset.status === s;
    b.classList.toggle("active", act);
    b.classList.toggle("active-own", b.dataset.status === "own" && act);
    b.classList.toggle("active-miss", b.dataset.status === "miss" && act);
  });
  render(false);
}
document.querySelectorAll("[data-status]").forEach(function(b){
  b.addEventListener("click", function(){ setStatus(b.dataset.status); });
});

document.getElementById("resetBtn").addEventListener("click", function(){
  if(viewSet) return;
  if(!confirm("Biztosan törlöd a teljes gyűjteményt?")) return;
  ownedSet.clear(); save(); render(false);
});

document.getElementById("selBonus").addEventListener("change", function(){
  state.bonus = this.value;
  render(false);
});

function showToast(msg){
  var t = document.getElementById("toast");
  if(!t){ t = document.createElement("div"); t.className = "toast"; t.id = "toast"; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove("show"); }, 2400);
}

function todayKey(){ var d = new Date(); var m = d.getMonth()+1, dd = d.getDate(); return d.getFullYear() + "-" + (m<10?"0":"") + m + "-" + (dd<10?"0":"") + dd; }
function keyFromDate(d){ var m = d.getMonth()+1, dd = d.getDate(); return d.getFullYear() + "-" + (m<10?"0":"") + m + "-" + (dd<10?"0":"") + dd; }
function noteToday(){
  try{
    if(!streakData.days) streakData.days = {};
    streakData.days[todayKey()] = Array.from(ownedSet);
    var ks = Object.keys(streakData.days).sort();
    while(ks.length > 366){ delete streakData.days[ks.shift()]; }
    localStorage.setItem(STREAK_KEY, JSON.stringify(streakData));
  }catch(e){}
}
function updateStreak(){
  var el = document.getElementById("streakBadge");
  if(!el) return;
  var n = 0;
  try{
    var days = (streakData && streakData.days) ? streakData.days : {};
    var active = function(k){ var a = days[k]; return !!(a && a.length); };
    var anchor = new Date();
    if(!active(todayKey())) anchor.setDate(anchor.getDate() - 1);
    while(active(keyFromDate(anchor))){ n++; anchor.setDate(anchor.getDate() - 1); }
  }catch(e){}
  el.style.display = n > 0 ? "inline-flex" : "none";
  el.textContent = n > 0 ? ("🔥 " + n + " napos sorozat") : "";
}

function setFlat(f){
  state.flat = f;
  var btn = document.getElementById("flatBtn");
  if(btn){ btn.classList.toggle("active", f); btn.textContent = f ? "⊟ Kategóriás" : "⊞ Egyben"; }
  try{ localStorage.setItem(FLAT_KEY, f ? "1" : "0"); }catch(e){}
  render(false);
}
function setTheme(t){
  document.documentElement.dataset.theme = t;
  var btn = document.getElementById("themeBtn");
  if(btn){ btn.textContent = t === "light" ? "☀️" : "🌙"; btn.title = t === "light" ? "Váltás sötét témára" : "Váltás világos témára"; }
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
}

function buildMask(){
  var m = 0n;
  PETS.forEach(function(p, i){ if(ownedSet.has(p.vnum)) m |= (1n << BigInt(i)); });
  return m.toString(16);
}
function parseMask(hex){
  if(typeof hex !== "string" || !/^[0-9a-fA-F]+$/.test(hex) || hex.length > 256) return null;
  var m;
  try{ m = BigInt("0x" + hex); }catch(e){ return null; }
  if(m < 0n) return null;
  var res = [];
  PETS.forEach(function(p, i){ if((m >> BigInt(i)) & 1n) res.push(p.vnum); });
  return res;
}
function copyFallback(text){
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}

try{ state.flat = localStorage.getItem(FLAT_KEY) === "1"; }catch(e){}
try{ streakData = JSON.parse(localStorage.getItem(STREAK_KEY) || '{"days":{}}'); }catch(e){}
if(!streakData || typeof streakData !== "object" || !streakData.days) streakData = { days:{} };
(function(){
  var b = document.getElementById("flatBtn");
  if(b){ b.classList.toggle("active", state.flat); b.textContent = state.flat ? "⊟ Kategóriás" : "⊞ Egyben"; b.addEventListener("click", function(){ setFlat(!state.flat); }); }
  var tb = document.getElementById("themeBtn");
  if(tb){ tb.addEventListener("click", function(){ setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light"); }); }
  setTheme(document.documentElement.dataset.theme || "dark");
  var sh = document.getElementById("shareBtn");
  if(sh){ sh.addEventListener("click", function(){
    var url = location.origin + location.pathname + "?owned=" + buildMask();
    var ok = function(){ showToast("Megosztási link a vágólapon! 📋"); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(ok, function(){ copyFallback(url); ok(); }); }
    else { copyFallback(url); ok(); }
  }); }
  var params = new URLSearchParams(location.search);
  var hex = params.get("owned");
  if(hex){
    var list = parseMask(hex);
    var banner = document.getElementById("shareBanner");
    if(banner && list && list.length){
      var have = 0;
      list.forEach(function(v){ if(ownedSet.has(v)) have++; });
      document.getElementById("sbTxt").textContent = "🔗 Megosztott lista: " + list.length + " kisállat (sajátodból már " + have + " megvan).";
      banner.hidden = false;
      var finish = function(){ banner.hidden = true; try{ history.replaceState(null, "", location.pathname + location.hash); }catch(e){} };
      document.getElementById("sbView").addEventListener("click", function(){
        viewSet = new Set(list);
        var bar = document.getElementById("viewBar");
        if(bar){
          document.getElementById("viewBarTxt").textContent = "🔭 Más gyűjteményét nézed (" + list.length + "/" + PETS.length + " kisállat). A sajátod változatlan marad.";
          bar.style.display = "flex";
          document.getElementById("viewExit").addEventListener("click", exitView);
        }
        finish();
        render(false);
      });
      document.getElementById("sbReplace").addEventListener("click", function(){
        ownedSet = new Set();
        list.forEach(function(v){ ownedSet.add(v); });
        save(); render(false); finish();
      });
      document.getElementById("sbMerge").addEventListener("click", function(){
        list.forEach(function(v){ ownedSet.add(v); });
        save(); render(false); finish();
      });
      document.getElementById("sbDismiss").addEventListener("click", finish);
    }
  }
})();
function exitView(){
  viewSet = null;
  var bar = document.getElementById("viewBar");
  if(bar) bar.style.display = "none";
  render(false);
}
noteToday();
updateStreak();

buildBonusMenu();
loadCatChips();
updateStats();
render(false);
(function(){var bt=document.getElementById("bonusTab");var toggle=document.getElementById("btToggle");var close=document.getElementById("btClose");if(toggle)toggle.addEventListener("click",function(){bt.classList.toggle("open");});if(close)close.addEventListener("click",function(){bt.classList.remove("open");});})();
</script>
